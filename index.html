<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario RTC - Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #9d4edd;
            --bg-dark: #07070a;
            --bg-card: rgba(18, 18, 28, 0.85);
            --text-main: #e2e8f0;
            --text-muted: #8b9bb4;
            --danger: #ff2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(157, 78, 221, 0.08), transparent 25%);
            background-attachment: fixed;
            min-height: 100vh;
            padding-bottom: 50px;
        }
        
        /* Header Futurista */
        header {
            background: rgba(7, 7, 10, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding: 1.5rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.2rem;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--neon-blue), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .auth-container {
            position: absolute;
            top: 50%;
            right: 1.5rem;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-status {
            font-size: 0.85rem;
            color: var(--neon-purple);
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(157, 78, 221, 0.5);
        }

        .container {
            max-width: 1200px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }
        
        /* Controles y Búsqueda */
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .search-bar {
            flex: 1;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* Botones estilo Cyber/Neon */
        .btn {
            background: rgba(0, 243, 255, 0.05);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-admin { display: none; }
        
        .btn-logout {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
            font-size: 0.8rem;
            padding: 0.6rem 1.2rem;
            display: none;
        }
        .btn-logout:hover {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.6);
        }

        .btn-delete {
            border-color: var(--danger);
            color: var(--danger);
            font-size: 0.75rem;
            margin-top: 1rem;
            width: 100%;
        }
        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.5);
        }

        /* Grid de Productos */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Tarjetas Glassmorphism */
        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.5), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 243, 255, 0.3);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .card:hover::before { opacity: 1; }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #000;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        
        .card:hover img { opacity: 1; }

        .card-body {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .badge {
            align-self: flex-start;
            background: rgba(157, 78, 221, 0.15);
            color: #d8b4fe;
            border: 1px solid rgba(157, 78, 221, 0.3);
            font-size: 0.7rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.2rem;
            margin: 0 0 0.5rem 0;
            color: #fff;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .price {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        /* Modales Cyberpunk */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: #0d0d14;
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 243, 255, 0.05);
            position: relative;
        }

        .modal-content h2 {
            margin-bottom: 1.5rem;
            color: #fff;
            font-weight: 300;
            text-align: center;
            letter-spacing: 1px;
        }

        .form-group { margin-bottom: 1.2rem; }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.02);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-close {
            border-color: #475569;
            color: #94a3b8;
        }
        .btn-close:hover {
            background: #475569;
            color: white;
            box-shadow: none;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 0.8rem;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>INVENTARIO RTC</h1>
        <p>Sync Node // Cloud Online</p>
        <div class="auth-container">
            <span class="user-status" id="userStatusText">ACCESO: PÚBLICO</span>
            <button class="btn" id="loginBtn" onclick="abrirModalLogin()">Conectar Auth</button>
            <button class="btn btn-logout" id="logoutBtn" onclick="cerrarSesion()">Desconectar</button>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <input type="text" id="searchInput" class="search-bar" placeholder="Buscar en la base de datos (Nombre o Categoría)..." onkeyup="filtrarProductos()">
            <button class="btn btn-admin" id="btnAddProduct" onclick="abrirModalAdmin()">[+] Nuevo Registro</button>
        </div>

        <div class="grid" id="productGrid">
            <!-- Los productos se cargan dinámicamente desde Railway -->
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2>Portal de Administrador</h2>
            <form id="loginForm" onsubmit="ejecutarLogin(event)">
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="text" id="authUser" required placeholder="Escribe: RTC">
                </div>
                <div class="form-group">
                    <label>Clave de Acceso</label>
                    <input type="password" id="authPass" required placeholder="Escribe: RTC1234">
                </div>
                <div class="error-msg" id="loginError">Credenciales denegadas. Intenta de nuevo.</div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-close" onclick="cerrarModalLogin()">Abortar</button>
                    <button type="submit" class="btn">Autenticar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Añadir Producto -->
    <div class="modal" id="adminModal">
        <div class="modal-content" style="max-width: 500px;">
            <h2>Insertar Datos</h2>
            <form id="productForm" onsubmit="guardarProducto(event)">
                <div class="form-group">
                    <label>Designación del Producto</label>
                    <input type="text" id="nombre" required placeholder="Ej. Hub USB-C Cyberpunk">
                </div>
                <div class="form-group">
                    <label>Clasificación</label>
                    <select id="categoria">
                        <option value="Audio">Módulo Audio</option>
                        <option value="Telefonía">Telecomunicaciones</option>
                        <option value="Accesorios">Periféricos Extra</option>
                        <option value="Cómputo">Hardware Principal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Valor de Intercambio ($ MXN)</label>
                    <input type="number" id="precio" step="0.01" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Especificaciones</label>
                    <textarea id="descripcion" rows="2" placeholder="Datos técnicos..."></textarea>
                </div>
                <div class="form-group">
                    <label>Carga Visual (Imagen opcional)</label>
                    <input type="file" id="imagenInput" accept="image/*" onchange="convertirImagen(event)" style="padding: 0.5rem; background: transparent; border: 1px dashed rgba(0, 243, 255, 0.4);">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-close" onclick="cerrarModalAdmin()">Cancelar</button>
                    <button type="submit" class="btn">Subir al Nodo</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // LÓGICA DE CONEXIÓN ONLINE CON BACKEND (Railway)
        let isAdmin = localStorage.getItem('adminAuth') === 'true';
        let baseDeDatos = [];
        let imagenTemporal = "";

        function getAuthHeaders() {
            return {
                'X-Admin-User': localStorage.getItem('adminUser') || '',
                'X-Admin-Password': localStorage.getItem('adminPass') || ''
            };
        }

        function actualizarInterfazAuth() {
            const btnAdd = document.getElementById("btnAddProduct");
            const loginBtn = document.getElementById("loginBtn");
            const logoutBtn = document.getElementById("logoutBtn");
            const statusText = document.getElementById("userStatusText");

            if (isAdmin) {
                btnAdd.style.display = "block";
                loginBtn.style.display = "none";
                logoutBtn.style.display = "block";
                statusText.textContent = "ACCESO: ROOT";
                statusText.style.color = "var(--neon-blue)";
                statusText.style.textShadow = "0 0 5px rgba(0, 243, 255, 0.5)";
            } else {
                btnAdd.style.display = "none";
                loginBtn.style.display = "block";
                logoutBtn.style.display = "none";
                statusText.textContent = "ACCESO: PÚBLICO";
                statusText.style.color = "var(--neon-purple)";
                statusText.style.textShadow = "0 0 5px rgba(157, 78, 221, 0.5)";
            }
            renderizarProductos(baseDeDatos);
        }

        async function cargarProductos() {
            try {
                const res = await fetch('./api.php?t=' + new Date().getTime());
                const json = await res.json();
                
                if (json.success && json.data) {
                    baseDeDatos = json.data;
                } else {
                    baseDeDatos = [];
                }
                renderizarProductos(baseDeDatos);
            } catch (error) {
                console.error("Error al cargar productos del servidor:", error);
            }
        }

        function renderizarProductos(lista) {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";
            
            if (!lista || lista.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-weight: 300;">No se encontraron registros en el sistema.</p>';
                return;
            }

            lista.forEach(p => {
                const btnEliminarHtml = isAdmin ? `<button class="btn btn-delete" onclick="eliminarProducto(${p.id})">Purgar Registro</button>` : '';
                const imgSrc = p.imagen_url && p.imagen_url.trim() !== "" ? p.imagen_url : "https://via.placeholder.com/300x300/12121c/00f3ff?text=No+Data";
                
                grid.innerHTML += `
                    <div class="card">
                        <div>
                            <img src="${imgSrc}" alt="${p.nombre}">
                            <div class="card-body">
                                <span class="badge">${p.categoria}</span>
                                <h3 class="card-title">${p.nombre}</h3>
                                <p class="card-desc">${p.descripcion || 'Sin especificaciones listadas.'}</p>
                            </div>
                        </div>
                        <div class="card-body" style="padding-top: 0;">
                            <div class="price">$${parseFloat(p.precio).toFixed(2)}</div>
                            ${btnEliminarHtml}
                        </div>
                    </div>
                `;
            });
        }

        function filtrarProductos() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtrados = baseDeDatos.filter(p => 
                p.nombre.toLowerCase().includes(query) || 
                p.categoria.toLowerCase().includes(query)
            );
            renderizarProductos(filtrados);
        }

        /* Funciones de Modales y Login */
        function abrirModalLogin() { document.getElementById("loginModal").style.display = "flex"; }
        function cerrarModalLogin() { 
            document.getElementById("loginModal").style.display = "none"; 
            document.getElementById("loginError").style.display = "none";
            document.getElementById("loginForm").reset();
        }

        function ejecutarLogin(e) {
            e.preventDefault();
            const u = document.getElementById("authUser").value;
            const p = document.getElementById("authPass").value;

            // Credenciales: Usuario: RTC / Clave: RTC1234
            if (u === "RTC" && p === "RTC1234") {
                localStorage.setItem('adminAuth', 'true');
                localStorage.setItem('adminUser', u);
                localStorage.setItem('adminPass', p);
                isAdmin = true;
                cerrarModalLogin();
                actualizarInterfazAuth();
                cargarProductos();
            } else {
                document.getElementById("loginError").style.display = "block";
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('adminAuth');
            localStorage.removeItem('adminUser');
            localStorage.removeItem('adminPass');
            isAdmin = false;
            actualizarInterfazAuth();
            cargarProductos();
        }

        function abrirModalAdmin() { document.getElementById("adminModal").style.display = "flex"; }
        function cerrarModalAdmin() { 
            document.getElementById("adminModal").style.display = "none";
            document.getElementById("productForm").reset();
            imagenTemporal = "";
        }

        function convertirImagen(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    imagenTemporal = reader.result;
                };
                reader.readAsDataURL(file);
            }
        }

        /* CRUD de Productos Online */
        async function guardarProducto(e) {
            e.preventDefault();
            if (!isAdmin) return;

            const data = {
                nombre: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value,
                precio: document.getElementById('precio').value,
                descripcion: document.getElementById('descripcion').value,
                imagen_url: imagenTemporal || ""
            };

            try {
                const res = await fetch('./api.php', {
                    method: 'POST',
                    headers: { ...getAuthHeaders(), 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await res.json();
                if (result.success) {
                    cerrarModalAdmin();
                    cargarProductos();
                } else {
                    alert("Error al registrar: " + result.message);
                }
            } catch (error) {
                console.error("Error al guardar producto:", error);
            }
        }

        async function eliminarProducto(id) {
            if (!isAdmin) return;
            if (!confirm('¿Confirmas la eliminación permanente de este registro?')) return;
            
            try {
                const res = await fetch('./api.php?id=' + id, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                const result = await res.json();
                if (result.success) {
                    cargarProductos();
                } else {
                    alert("Error al eliminar: " + result.message);
                }
            } catch (error) {
                console.error("Error al eliminar producto:", error);
            }
        }

        // Inicializar interfaz y descargar datos reales de la base de datos
        actualizarInterfazAuth();
        cargarProductos();
    </script>
</body>
</html>
